<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- 1200×630 social share card, rendered to public/images/og-default.png by
     scripts/generate-og-image.mjs (headless Chromium screenshot). Brand colors
     mirror src/styles/global.css; typography mirrors the site (Inter). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(to bottom right, #075E54 0%, #0A7B6E 55%, #128C7E 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Same radial glow as Hero.astro */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(37, 211, 102, 0.16), transparent 60%);
  }
  .bloom {
    position: absolute; width: 560px; height: 560px; border-radius: 50%;
    background: rgba(37, 211, 102, 0.10); filter: blur(90px);
    top: -180px; right: -140px;
  }
  .bloom2 {
    position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: rgba(124, 58, 237, 0.12); filter: blur(90px);
    bottom: -200px; left: -120px;
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 80px; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .brand img { width: 92px; height: 92px; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
  .brand .wordmark { font-size: 74px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .brand .wordmark .tld { color: #25D366; }
  h1 {
    font-size: 41px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.15; margin-bottom: 18px;
  }
  .value {
    font-size: 25px; font-weight: 500; color: rgba(220, 255, 233, 0.88);
    margin-bottom: 40px;
  }
  .value .dot { color: #25D366; font-weight: 800; padding: 0 10px; }
  .meta-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    font-size: 19px; font-weight: 500; color: rgba(220, 255, 233, 0.95);
  }
  .meta-pill svg { width: 22px; height: 22px; color: #d1fae5; }
  .url { margin-top: 34px; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="bloom"></div>
  <div class="bloom2"></div>
  <div class="card">
    <div class="brand">
      <img src="../public/images/logos/logo.jpg" alt="waai logo" />
      <div class="wordmark">waai<span class="tld">.me</span></div>
    </div>
    <h1>WhatsApp AI Agent Platform</h1>
    <div class="value">AI Auto-Replies<span class="dot">·</span>Bookings<span class="dot">·</span>Orders<span class="dot">·</span>CRM</div>
    <div class="meta-pill">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.908 44.908 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.358-2.602zm-10.201.553c1.265 0 2.058.791 2.675 1.446.307.327.737.871 1.234 1.579l-1.02 1.566c-.757 1.163-1.882 3.017-2.837 4.338-1.191 1.649-1.81 1.817-2.486 1.817-.524 0-1.038-.237-1.383-.794-.263-.426-.464-1.13-.464-2.046 0-2.221.63-4.535 1.66-6.088.454-.687.964-1.226 1.533-1.533a2.264 2.264 0 0 1 1.088-.285z"/></svg>
      Official Meta Tech Provider
    </div>
    <div class="url">waai.me</div>
  </div>
</body>
</html>
