name: Weekly blog post

# Generates a waai blog post via the z.ai GLM API and opens a PR for review.
# - Weekly (Tue ~09:07 SGT): English post.
# - 1st of month (~08:13 SGT): a multilingual post, alternating Chinese / Malay.
# Manual: workflow_dispatch with a lang input to generate on demand.
# News-commentary mode: dispatch with source_url to fetch a third-party article and
# write an ORIGINAL post that cites it (category=News, originality-checked).
on:
  schedule:
    - cron: "7 1 * * 2"    # Tue 01:07 UTC = ~09:07 SGT (English weekly)
    - cron: "13 0 1 * *"   # 1st of month 00:13 UTC = ~08:13 SGT (multilingual)
  workflow_dispatch:
    inputs:
      lang:
        description: "Language (en / zh / ms)"
        default: "en"
      source_url:
        description: "Source article URL — enables news-commentary mode (original post that cites the source)"
        required: false
        default: ""
      source_name:
        description: "Source display name override (optional, e.g. 'IDC via WhatsApp for Business')"
        required: false
        default: ""

permissions:
  contents: write        # push the blog/auto-* branch
  pull-requests: write   # open the PR

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine language
        id: lang
        env:
          SRC_URL: ${{ inputs.source_url }}
          LANG_IN: ${{ inputs.lang }}
        run: |
          if [ -n "$SRC_URL" ]; then
            # news-commentary dispatch: lang comes straight from the input, never the monthly rotation
            echo "lang=${LANG_IN:-en}" >> "$GITHUB_OUTPUT"
          elif [ -n "$LANG_IN" ]; then
            echo "lang=$LANG_IN" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ]; then
            # 1st of month: alternate zh / ms by month number
            M=$(date -u +%m)
            if [ $((10#$M % 2)) -eq 0 ]; then echo "lang=zh" >> "$GITHUB_OUTPUT"; else echo "lang=ms" >> "$GITHUB_OUTPUT"; fi
          else
            echo "lang=en" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate post
        id: gen
        run: node scripts/generate-blog-post.mjs
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          BLOG_LANG: ${{ steps.lang.outputs.lang }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_NAME: ${{ inputs.source_name }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "blog: ${{ steps.gen.outputs.mode == 'news' && 'news commentary' || 'automated post' }} (${{ steps.lang.outputs.lang }}) — ${{ steps.gen.outputs.slug }}"
          branch: blog/auto-${{ github.run_id }}
          title: "blog: ${{ steps.gen.outputs.mode == 'news' && '[news] ' || '' }}${{ steps.gen.outputs.title }}"
          body: |
            **Automated blog post — eyeball before merging.**

            - **Mode:** ${{ steps.gen.outputs.mode == 'news' && 'News commentary — reacts to a source article. Check the quotes are ≤2 and short, and that no passage is lifted.' || 'Topic rotation' }}
            - **Language:** ${{ steps.lang.outputs.lang }}
            - **Pillar:** ${{ steps.gen.outputs.pillar }}
            - **Category:** ${{ steps.gen.outputs.category }}
            - **Source:** ${{ steps.gen.outputs.source_url || '—' }}
            - **Originality check:** ${{ steps.gen.outputs.source_check || 'n/a' }}

            Edit the markdown directly in this PR to tweak it. **Merge to publish** (auto-deploys via `deploy.yml`).

            Live after merge: https://waai.me/blog/${{ steps.gen.outputs.slug }}/
          labels: automated-blog
          delete-branch: true
